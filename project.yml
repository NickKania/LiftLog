name: LiftLog
options:
  bundleIdPrefix: com.liftlog
  deploymentTarget:
    iOS: "17.0"
packages:
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    minorVersion: 0.8.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  LiftLog:
    type: application
    platform: iOS
    info:
      path: LiftLog/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: workout
            CFBundleURLSchemes:
              - liftlog
        NSUbiquitousContainers:
          iCloud.com.liftlog.app:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Lift Log
            NSUbiquitousContainerSupportedFolderLevels: Any
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    sources:
      - path: LiftLog
        excludes:
          - App/Info.plist
          - Info.plist
    dependencies:
      - target: LiftLogWidgets
      - sdk: libsqlite3.tbd
      - package: swift-markdown
        product: Markdown
    entitlements:
      path: LiftLog/LiftLog.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.liftlog.app
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.liftlog.app
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: LiftLog/LiftLog.entitlements
        INFOPLIST_FILE: LiftLog/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: nkania.WeightsTracker
        DEVELOPMENT_TEAM: 2CUP94Z3Q9
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: LiftLog
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lift Log
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  LiftLogWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LiftLogWidgets
        excludes:
          - Info.plist
      - path: LiftLog/Shared/WorkoutActivityAttributes.swift
      - path: LiftLog/Core/WorkoutActivitySnapshot.swift
    info:
      path: LiftLogWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nkania.WeightsTracker.Widgets
        DEVELOPMENT_TEAM: 2CUP94Z3Q9
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: LiftLogWidgets
        INFOPLIST_KEY_CFBundleDisplayName: Lift Log Workout
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
  LiftLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/LiftLogUITests
    dependencies:
      - target: LiftLog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.liftlog.uitests
schemes:
  LiftLog:
    build:
      targets:
        LiftLog: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LiftLogUITests
