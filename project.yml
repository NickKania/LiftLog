name: LiftLog
options:
  bundleIdPrefix: com.liftlog
  deploymentTarget:
    iOS: "17.0"
packages:
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    minorVersion: 0.8.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  LiftLog:
    type: application
    platform: iOS
    info:
      path: LiftLog/App/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    sources:
      - path: LiftLog
        excludes:
          - App/Info.plist
    dependencies:
      - sdk: libsqlite3.tbd
      - package: swift-markdown
        product: Markdown
    entitlements:
      path: LiftLog/LiftLog.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.liftlog.app
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.liftlog.app
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: LiftLog/LiftLog.entitlements
        INFOPLIST_FILE: LiftLog/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.liftlog.app
        PRODUCT_NAME: LiftLog
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lift Log
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  LiftLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/LiftLogUITests
    dependencies:
      - target: LiftLog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.liftlog.uitests
schemes:
  LiftLog:
    build:
      targets:
        LiftLog: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LiftLogUITests
